[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "django-types>=0.24.0",
  "poethepoet>=0.48.0",
  "ty"
]

[project]
name = "crm-jobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "django>=6.1.1",
  "pytest>=9.1.1",
  "pytest-cov>=4.1.0",
  "pytest-django>=4.14.0",
  "ruff>=0.16.8",
  "whitenoise>=6.11.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/jobs"]

[tool.commitizen] # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:"
]

[tool.coverage.run]
omit = [
  # Django writes these, and gunicorn is what runs them.
  "src/config/asgi.py",
  "src/config/wsgi.py",
  "src/jobs/migrations/*"
]

[tool.poe]
include = "Taskfile.toml"

[tool.uv]
exclude-newer-package = { "ruff" = false }

[tool.pytest.ini_options] # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
DJANGO_SETTINGS_MODULE = "src.config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests"
]
filterwarnings = [
  # WhiteNoise serves from STATIC_ROOT, which collectstatic creates on deploy.
  # pytest-django runs with DEBUG off, so WhiteNoise looks for the directory and
  # says so; the suite renders pages, it never serves their static files.
  "ignore:No directory at:UserWarning"
]
addopts = [
  "--cov=src/",
  "--import-mode=importlib",
  "--cov-report=term",
  "--cov-report=html:coverage/html",
  "--cov-report=xml:coverage/coverage.xml",
  "--junitxml=coverage/junit/test-results.xml",
  "--color=yes",
  "--strict-config",
  "--strict-markers"
]

[tool.pytest_env]
ENVIRONMENT = "test"

[tool.ty.src]
exclude = ["src/jobs/migrations"]

[tool.ty.terminal]
output-format = "full"
