version: 3

tasks:
  dev:
    desc: Run development server
    cmds:
      - python manage.py runserver

  test:
    desc: Run pytest
    cmds:
      - pytest

  qa:
    desc: Run all quality checks
    cmds:
      - ruff check .
      - ruff format --check .
      - pyright
      - pytest
      - python manage.py check --deploy
