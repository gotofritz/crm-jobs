name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # the badge push needs the full history of the badges branch
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --locked fails on a stale uv.lock instead of rewriting it, so a
        # lockfile problem breaks the PR rather than the badge push on main
        run: uv sync --locked

      - name: Run QA checks
        run: uv run poe qa

      - name: Check worktree is clean
        # the badge push switches branches; catch a dirty tree on PRs too
        run: git diff --exit-code

      - name: Generate coverage badge
        run: |
          uv tool install coverage-badge
          coverage-badge -f -o coverage.svg

      - name: Push coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges:badges
          git checkout badges
          mkdir -p crm-jobs
          cp coverage.svg crm-jobs/
          git add crm-jobs/coverage.svg
          git commit --allow-empty -m "chore: update coverage badge"
          git push origin badges
